# P1-2: Nginx 配置 (反代 + 静态托管 + TLS)
#   - SPA 路由: 所有非 API 路径 fallback 到 index.html
#   - API 反代: /api/* → api:8080 容器 (docker-compose 网络)
#   - 静态资源: 1 年缓存 + immutable
#   - 安全头: HSTS, X-Frame-Options, CSP 等
#   - Gzip: 文本类资源压缩
#   - TLS: 443 HTTPS (自签名证书演练, 生产换 Let's Encrypt 即可, 配置路径不变)
#   - 80 → 301 跳转 HTTPS (health check 保留在 80, 供容器健康检查)

upstream sakura_api {
    server api:8080;
    keepalive 32;
}

# Cloudflare 代理时，来源 TCP 地址是 Cloudflare 边缘节点而不是访客。
# 仅在连接确实来自 Cloudflare 公布网段时才接受 CF-Connecting-IP，避免访客
# 直连源站时伪造该头绕过 API 的按 IP 限流。清单来源见 cloudflare-realip.conf。
include /etc/nginx/cloudflare-realip.conf;

# === HTTP :80 — 仅健康检查 + 301 跳转 HTTPS ===
server {
    listen 80;
    server_name _;

    # 容器健康检查入口 (docker healthcheck 走 http, 不跟随重定向)
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# === HTTPS :443 — 完整站点 ===
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书 (自签名演练; 生产替换为 Let's Encrypt 全链, 挂载路径不变)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 🔧 fix(部署演练): 显式 root — Alpine 版 nginx prefix=/etc/nginx, 默认 root=/etc/nginx/html 不存在,
    #   try_files 找不到 index.html 触发内部重定向循环 (500)
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头 (include 片段, 见 security-headers.conf WHY)
    include /etc/nginx/conf.d/security-headers.conf;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 客户端最大请求体 (与 API Kestrel 限制对齐)
    client_max_body_size 10M;

    # realip 模块会把受信任 Cloudflare 请求的 $remote_addr 还原为访客 IP。
    # 后续 proxy_add_x_forwarded_for 将它交给 API；API 只信任 Docker 内的 Nginx。
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # API 反代
    location /api/ {
        proxy_pass http://sakura_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Swagger (后台 API 文档页, 反代到 backend; 🔧 fix(审查): 此前生产无此 location → 回退 SPA index.html, 文档页加载失败)
    location /swagger {
        proxy_pass http://sakura_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SSE 长连接 (ETL 实时进度)
    location /api/etl/progress {
        proxy_pass http://sakura_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s; # 24h
    }

    # 健康端点 (后端注册于 /health/live 与 /health/ready — CommonEndpoints.cs)
    location = /health/live {
        proxy_pass http://sakura_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ready {
        proxy_pass http://sakura_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源 (含 hash 命名的 Vite 构建产物, 1 年缓存)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    # 🔧 fix(2026-08-24 演示): 缩略图回退目录 — 前端 search 卡片 img src=/oem2/{oem3}.jpg
    #   临时把图片放 nginx 静态目录 (容器内 /usr/share/nginx/html/oem2/),
    #   让 AggregateSearchView 搜索卡片缩略图可显示; 长期方案: 后端 aggregate
    #   补 primaryImageUrl + 前端 getPrimaryImageUrl 改读 (见 ADR #33)
    location /oem2/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # === SEO 路由反代到 ASP.NET backend (须在 SPA fallback 之前) ===

    # 商品详情页 (SEO 优化路由, 由 ASP.NET SSR/预渲染处理)
    location ~ ^/products/ {
        proxy_pass http://sakura_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 旧商品 URL 301 重定向 (由 backend 处理到 /products/ 的重定向逻辑)
    location ~ ^/product/ {
        proxy_pass http://sakura_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SEO sitemap (sitemap.xml 及 sitemaps/ 目录)
    location ~ ^/(sitemap\.xml|sitemaps/) {
        proxy_pass http://sakura_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # robots.txt (精确匹配, 优先级高于正则)
    location = /robots.txt {
        proxy_pass http://sakura_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback (所有非 API/资源路径)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
    }
}
