# 安全响应头 (include 片段)
# WHY: nginx add_header 继承规则 — location 内出现 add_header 时, server 级 add_header 全部被覆盖。
#      用 include 统一注入, 避免 location (/, /assets/, = /health) 各自丢失安全头 (预存缺陷, TLS 演练实证)。
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS (生产建议 max-age=31536000; includeSubDomains 需确认无子域明文依赖)
add_header Strict-Transport-Security "max-age=31536000" always;
# CSP 允许 Element Plus CDN (如使用) + 自身
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https:;" always;
