# SakuraFilter nginx 配置
#   - SPA 路由回退 (Vue Router history 模式)
#   - /api/ 反向代理到后端容器
#   - 静态资源长缓存
#   - resolver: 使用 Docker 内置 DNS 动态解析后端服务名

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS 解析器 (127.0.0.11 是 Docker 内置 DNS)
    # WHY 动态解析: nginx 启动时后端容器可能尚未就绪, 需运行时动态解析服务名
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ===== V2 SEO 路由 (spec L1054-1072, 必须在 SPA fallback 之前) =====
    #   WHY: SSR 详情页 / sitemap / 旧 URL 301 必须反代到 backend, 不能被 SPA fallback 吞掉

    # SEO 详情页 (Razor SSR, /products/:pn1/:pn2/:brand/:oem3)
    location ~ ^/products/ {
        proxy_pass http://backend:5148;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧 URL 301 重定向 (/product/:oem → 新 SEO URL)
    location ~ ^/product/ {
        proxy_pass http://backend:5148;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # sitemap.xml + sitemaps/*.xml
    location ~ ^/(sitemap\.xml|sitemaps/) {
        proxy_pass http://backend:5148;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt
    location = /robots.txt {
        proxy_pass http://backend:5148;
        proxy_set_header Host $host;
    }

    # SPA 路由回退: 所有非文件请求 → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器 (docker-compose 服务名: backend, 端口: 5148)
    location /api/ {
        proxy_pass http://backend:5148;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Swagger/OpenAPI 文档
    location /scalar {
        proxy_pass http://backend:5148;
        proxy_set_header Host $host;
    }
    location /swagger {
        proxy_pass http://backend:5148;
        proxy_set_header Host $host;
    }

    # 静态资源长缓存 (js/css 带 hash, 可 1 年缓存)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
